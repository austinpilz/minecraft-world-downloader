plugins {
    id "net.fabricmc.fabric-loom" version "1.18-SNAPSHOT"
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = "Meteor Dev Releases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "Meteor Dev Snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
}

dependencies {
    // Fabric
    // Minecraft now ships with official (Mojang) names, so no mappings or remapping step is needed.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor
    implementation "meteordevelopment:meteor-client:${project.meteor_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.jdk_version.toString() as int)
    }
}

/**
 * Converts a full Minecraft version into the compatibility range Fabric expects, e.g. 26.1.2 -> ~26.1
 */
static String toMinecraftCompat(String version) {
    def matcher = version =~ /^(\d{2})\.([1-9]\d*)(?:\.([1-9]\d*))?$/

    if (!matcher.matches()) {
        throw new GradleException("Invalid Minecraft version format: ${version}. Expected YY.D or YY.D.H")
    }

    return "~${matcher.group(1)}.${matcher.group(2)}"
}

processResources {
    def propertyMap = [
        "version"          : project.version,
        "minecraft_version": toMinecraftCompat(project.minecraft_version.toString()),
        "jdk_version"      : project.jdk_version,
    ]

    inputs.properties(propertyMap)

    filesMatching("fabric.mod.json") {
        expand(propertyMap)
    }
}

jar {
    inputs.property("archivesName", project.base.archivesName.get())

    from("LICENSE") {
        rename { "${it}_${inputs.properties["archivesName"]}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
}
